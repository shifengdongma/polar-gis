# Performance log format — captures timing and upstream info (no credentials)
log_format perf '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rt=$request_time uct=$upstream_connect_time '
                'uht=$upstream_header_time urt=$upstream_response_time';

upstream geoserver_backend {
    server geoserver:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5g;

    access_log /var/log/nginx/access.log perf;
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip — skip PNG tiles (already compressed)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /geoserver {
        return 301 $scheme://$http_host/geoserver/;
    }

    location /geoserver/ {
        proxy_pass http://geoserver_backend/geoserver/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://$host/ /;
        proxy_hide_header X-Powered-By;
        # Pass through caching headers from GeoServer / GWC
        proxy_pass_header Cache-Control;
        proxy_pass_header Expires;
        # Timeouts for tile requests
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
