# Performance log format — captures timing and upstream info (no credentials)
log_format perf '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rt=$request_time uct=$upstream_connect_time '
                'uht=$upstream_header_time urt=$upstream_response_time';

upstream geoserver_backend {
    server geoserver:8080;
    keepalive 16;
}

# WMS tile cache — reduces GeoServer rendering load on repeat requests
proxy_cache_path /var/cache/nginx/geoserver levels=1:2 keys_zone=geoserver_cache:10m max_size=10g inactive=24h use_temp_path=off;

server {
    listen 80 http2;
    server_name _;
    client_max_body_size 5g;

    access_log /var/log/nginx/access.log perf;
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip — skip PNG tiles (already compressed)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /geoserver {
        return 301 $scheme://$http_host/geoserver/;
    }

    location /geoserver/ {
        proxy_pass http://geoserver_backend/geoserver/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://$host/ /;
        proxy_hide_header X-Powered-By;
        # Pass through caching headers from GeoServer / GWC
        proxy_pass_header Cache-Control;
        proxy_pass_header Expires;
        # Timeouts for tile requests
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        # Nginx-level tile cache
        proxy_cache geoserver_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 302 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Skip caching for GetCapabilities (dynamic metadata)
        set $skip_cache 0;
        if ($args ~* "REQUEST=GetCapabilities") {
            set $skip_cache 1;
        }
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
    }

    # Hashed static assets — cache permanently
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.html;
    }

    # Images — cache 1 week
    location ~* \.(?:png|jpg|jpeg|gif|ico|webp)$ {
        expires 1w;
        add_header Cache-Control "public";
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback — never cache index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
