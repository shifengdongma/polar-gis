services:
  postgres:
    image: m.daocloud.io/docker.io/postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [public, internal]

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.3
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_PROXY_BASE_URL: ${GEOSERVER_PUBLIC_URL:-/geoserver}
      INITIAL_MEMORY: "2G"
      MAXIMUM_MEMORY: "4G"
      JAVA_OPTS: "-server -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -DGEOSERVER_CSRF_DISABLED=true"
    volumes:
      - geoserver-data:/opt/geoserver_data
      - shared-storage:/data/storage:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [public, internal]

  backend:
    image: polar-gis-backend:latest
    build:
      context: ../backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &backend-env
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:${PUBLIC_PORT}
      STORAGE_ROOT: /data/storage
      TEMP_ROOT: /data/storage/temp
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_PUBLIC_URL: ${GEOSERVER_PUBLIC_URL:-/geoserver}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_WORKSPACE: polar_gis
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      # 冰情叠加(只读环境数据;worker 经锚点同样获得,但不读取数据)
      ICE_ENABLED: ${ICE_ENABLED:-true}
      ICE_DATA_ROOT: /data/ice
      # 导航环境/规划。数据目录只读；结果目录位于共享存储，backend/worker 均可读写。
      NAVIGATION_ENABLED: ${NAVIGATION_ENABLED:-true}
      NAVIGATION_DATA_ROOT: /data/navigation
      NAVIGATION_ICE_DATA_ROOT: ${NAVIGATION_ICE_DATA_ROOT:-/data/ice}
      NAVIGATION_ICE_BACKEND: ${NAVIGATION_ICE_BACKEND:-auto}
      NAVIGATION_DEFAULT_DATA_POLICY: ${NAVIGATION_DEFAULT_DATA_POLICY:-real_only}
      PLANNER_RESULT_ROOT: ${PLANNER_RESULT_ROOT:-/data/storage/navigation/plans}
      PLANNER_MAX_CELLS: ${PLANNER_MAX_CELLS:-20000}
      PLANNER_MAX_CANDIDATES: ${PLANNER_MAX_CANDIDATES:-20}
      PLANNER_MAX_GENERATIONS: ${PLANNER_MAX_GENERATIONS:-100}
      PLANNER_POPULATION_SIZE: ${PLANNER_POPULATION_SIZE:-36}
      PLANNER_TIMEOUT_SECONDS: ${PLANNER_TIMEOUT_SECONDS:-300}
      PLANNER_MAX_CONCURRENT_JOBS: ${PLANNER_MAX_CONCURRENT_JOBS:-1}
      PLANNER_MAX_QUEUED_RUNS: ${PLANNER_MAX_QUEUED_RUNS:-10}
      PLANNER_MAX_RETAINED_RUNS: ${PLANNER_MAX_RETAINED_RUNS:-100}
    restart: unless-stopped
    volumes:
      - shared-storage:/data/storage
      - ../data/s57-basemaps:/data/s57-basemaps:ro
      # 冰情 NetCDF 数据目录只读挂载;本地验证可用 ICE_DATA_HOST_PATH 覆盖
      - ${ICE_DATA_HOST_PATH:-../data/ice}:/data/ice:ro
      # 导航环境数据(水深/风/浪/流/海冰合成研究文件)
      - ${NAVIGATION_DATA_HOST_PATH:-../data/navigation}:/data/navigation:ro
    depends_on:
      postgres:
        condition: service_healthy
      geoserver:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  worker:
    image: polar-gis-backend:latest
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - shared-storage:/data/storage
      - ../data/s57-basemaps:/data/s57-basemaps:ro
      # 规划 worker 必须能读到与 backend 相同的海冰/导航数据
      - ${ICE_DATA_HOST_PATH:-../data/ice}:/data/ice:ro
      - ${NAVIGATION_DATA_HOST_PATH:-../data/navigation}:/data/navigation:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  web:
    image: polar-gis-frontend:latest
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [public, internal]

volumes:
  postgres-data:
  geoserver-data:
  shared-storage:

networks:
  public:
  internal:
    internal: true
