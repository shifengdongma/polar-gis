services:
  postgres:
    image: m.daocloud.io/docker.io/postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [public, internal]

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.3
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_PROXY_BASE_URL: ${GEOSERVER_PUBLIC_URL:-/geoserver}
    volumes:
      - geoserver-data:/opt/geoserver_data
      - shared-storage:/data/storage:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [public, internal]

  backend:
    image: polar-gis-backend:latest
    build:
      context: ../backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &backend-env
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:${PUBLIC_PORT}
      STORAGE_ROOT: /data/storage
      TEMP_ROOT: /data/storage/temp
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_PUBLIC_URL: ${GEOSERVER_PUBLIC_URL:-/geoserver}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_WORKSPACE: polar_gis
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    restart: unless-stopped
    volumes:
      - shared-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      geoserver:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  worker:
    image: polar-gis-backend:latest
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - shared-storage:/data/storage
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  web:
    image: polar-gis-frontend:latest
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [public, internal]

volumes:
  postgres-data:
  geoserver-data:
  shared-storage:

networks:
  public:
  internal:
    internal: true
